name: Test Matrix & Email Report Pipeline

on:
  push:
    branches:
      - master

  schedule:
    - cron: '30 19 * * 0-4'   # Runs at 19:30 UTC (1:00 AM IST), Sunday through Thursday

  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run (atcu, lct, sampark)'
        required: false
      projects:
        description: 'Comma-separated list of projects, e.g. atcu,lct'
        required: false
      marker:
        description: 'Pytest marker expression, e.g. smoke, regression and not slow'
        required: false
      report_dir:
        description: 'Optional base report directory'
        required: false
        default: 'reports'

  repository_dispatch:
    types:
      - run-project-report

jobs:
  project_matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
    steps:
      - name: Select projects
        id: set-matrix
        env:
          DISPATCH_PROJECT: ${{ github.event.client_payload.project || github.event.inputs.project || '' }}
          DISPATCH_PROJECTS: ${{ github.event.client_payload.projects || github.event.inputs.projects || '' }}
        run: |
          python - <<'PY'
          import json
          import os

          available_projects = {"atcu", "lct", "sampark"}
          requested_projects = os.environ.get("DISPATCH_PROJECTS", "").strip()
          requested_project = os.environ.get("DISPATCH_PROJECT", "").strip()
          if requested_projects and requested_project:
              raise SystemExit("Specify either project or projects, not both")
          requested = requested_projects or requested_project

          if requested:
              projects = list(dict.fromkeys(
                  project.strip().lower()
                  for project in requested.split(",")
                  if project.strip()
              ))
              invalid_projects = sorted(set(projects) - available_projects)
              if not projects or invalid_projects:
                  raise SystemExit(
                      f"Invalid project selection: {', '.join(invalid_projects) or requested}"
                  )
          else:
              projects = ["atcu", "sampark", "lct"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"projects={json.dumps(projects, separators=(',', ':'))}\n")
          print(f"Selected project jobs: {', '.join(projects)}")
          PY

  test-and-report:
    name: Test & Report (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: project_matrix
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.project_matrix.outputs.projects) }}
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create project environment files from secrets
        if: env.PROJECT_CREDS != ''
        run: |
          python -c "
          import os, json
          creds = json.loads(os.getenv('PROJECT_CREDS', '{}'))
          for project, env_vars in creds.items():
              lines = [f'{k}={v}' for k, v in env_vars.items()]
              os.makedirs('config', exist_ok=True)
              with open(f'config/{project}.env', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
              print(f'Generated config/{project}.env')
          "
        env:
          PROJECT_CREDS: ${{ secrets.PROJECT_CREDS }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Playwright system dependencies
        run: |
          npx playwright install-deps || true

      - name: Run tests and generate reports
        continue-on-error: true
        env:
          EVENT_MARKER: ${{ github.event.client_payload.marker || github.event.inputs.marker || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          MATRIX_PROJECT="${{ matrix.project }}"
          TARGET_PROJECT="$MATRIX_PROJECT"
          echo "Commit Message: $COMMIT_MSG"

          if [ -z "$EVENT_MARKER" ] && [ -n "$COMMIT_MSG" ]; then
            PARSED_MARKER=$(echo "$COMMIT_MSG" | grep -oP '\[marker:\s*\K[^\]]+' || true)
            PARSED_MARKERS=$(echo "$COMMIT_MSG" | grep -oP '\[markers:\s*\K[^\]]+' || true)
            if [ -n "$PARSED_MARKERS" ]; then
              EVENT_MARKER="$PARSED_MARKERS"
            elif [ -n "$PARSED_MARKER" ]; then
              EVENT_MARKER="$PARSED_MARKER"
            fi
          fi

          TARGET_REPORT_DIR="reports/$TARGET_PROJECT"
          echo "TARGET_REPORT_DIR=$TARGET_REPORT_DIR" >> "$GITHUB_ENV"

          ARGS=(--report-dir "$TARGET_REPORT_DIR" --project "$TARGET_PROJECT")

          if [ -n "$EVENT_MARKER" ]; then
            ARGS+=(--marker "$EVENT_MARKER")
          elif [ -n "$CI" ]; then
            ARGS+=(--marker smoke)
          fi

          echo "Executing report generation for $TARGET_PROJECT"
          python utils/generate_reports.py "${ARGS[@]}"

      - name: Verify generated reports
        run: |
          echo "Checking for report files in $TARGET_REPORT_DIR..."
          REPORT_FILES=$(find "$TARGET_REPORT_DIR" -type f \( -name 'report.json' -o -name 'report.html' -o -name 'report.xlsx' \) 2>/dev/null | sort)
          echo "$REPORT_FILES"
          if [ -z "$REPORT_FILES" ]; then
            echo "No generated report files found"
            exit 1
          fi

      - name: Resolve report attachments
        id: report_attachments
        if: always()
        shell: bash
        run: |
          set -e
          BASE_DIR="$TARGET_REPORT_DIR"
          if [ ! -d "$BASE_DIR" ]; then
            echo "Report directory not found: $BASE_DIR"
            exit 0
          fi

          mapfile -t ATTACHMENTS < <(find "$BASE_DIR" -type f \( -name 'report.html' -o -name 'report.xlsx' \) | sort)
          if [ ${#ATTACHMENTS[@]} -eq 0 ]; then
            echo "No report attachments found"
            exit 0
          fi

          printf '%s\n' "${ATTACHMENTS[@]}" > attachment_paths.txt
          echo "attachments<<EOF" >> "$GITHUB_OUTPUT"
          cat attachment_paths.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Resolved report attachments:"
          cat attachment_paths.txt

      - name: Generate Dynamic Email Body
        if: always()
        env:
          REPORT_ACTOR: ${{ github.triggering_actor || github.actor }}
          REPORT_REF: ${{ github.ref_name }}
          REPORT_SHA: ${{ github.sha }}
        run: |
          python utils/prepare_email_metadata.py \
            --report-dir "$TARGET_REPORT_DIR" \
            --actor "$REPORT_ACTOR" \
            --run-number "${{ github.run_number }}" \
            --ref "$REPORT_REF" \
            --sha "$REPORT_SHA"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ matrix.project }}
          path: reports/${{ matrix.project }}

      - name: Send Execution Report Email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          secure: true
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            [CI/CD Notice] Test Execution Report (${{ matrix.project }}): ${{ github.repository }} | Branch: ${{ github.ref_name }} (Run #${{ github.run_number }})
          html_body: file://email_body.html
          to: ${{ secrets.TEST_MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          attachments: ${{ steps.report_attachments.outputs.attachments }}
